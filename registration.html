    <div class="container">
        <h2>Farmer Registration Form</h2>
        <hr>
        <div id="successBanner" class="success-message" style="display: none;"></div>

        <form id="farmerForm" action="/submit" method="post" enctype="multipart/form-data" novalidate>
            <fieldset>
                <legend>Personal & Farm Details</legend>

                <div class="form-group">
                    <label for="username">Farmer Name:</label>
                    <input type="text" id="username" name="username" placeholder="Enter farmer name" autofocus>
                    <span class="error-msg" id="usernameError"></span>
                </div>

                <div class="form-group">
                    <label for="mobile">Mobile Number:</label>
                    <input type="tel" id="mobile" name="mobile" placeholder="10-digit mobile number (e.g. 9876543210)">
                    <span class="error-msg" id="mobileError"></span>
                </div>

                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email (e.g. farmer@example.com)">
                    <span class="error-msg" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="plotid">Plot ID:</label>
                    <input type="text" id="plotid" name="plotid" placeholder="Enter your Plot ID (e.g. PLOT-101)">
                    <span class="error-msg" id="plotidError"></span>
                </div>

                <div class="form-group">
                    <label for="village">Village:</label>
                    <input type="text" id="village" name="village" placeholder="Enter village name">
                    <span class="error-msg" id="villageError"></span>
                </div>

                <div class="form-group">
                    <label for="cropstage">Crop Stage:</label>
                    <select id="cropstage" name="cropstage">
                        <option value="">-- Select Crop Stage --</option>
                        <option value="Sowing">Sowing / Germination</option>
                        <option value="Vegetative">Vegetative Growth</option>
                        <option value="Flowering">Flowering / Reproductive</option>
                        <option value="Yield Formation">Yield Formation / Maturation</option>
                        <option value="Harvesting">Harvesting Stage</option>
                    </select>
                    <span class="error-msg" id="cropstageError"></span>
                </div>

                <div class="form-group">
                    <label for="soiltype">Soil Type:</label>
                    <select id="soiltype" name="soiltype">
                        <option value="">-- Select Soil Type --</option>
                        <option value="Alluvial">Alluvial Soil</option>
                        <option value="Black">Black Soil (Regur)</option>
                        <option value="Red">Red & Yellow Soil</option>
                        <option value="Laterite">Laterite Soil</option>
                        <option value="Sandy">Sandy / Arid Soil</option>
                        <option value="Clay">Clay Soil</option>
                    </select>
                    <span class="error-msg" id="soiltypeError"></span>
                </div>

                <div class="form-group">
                    <label for="method">Irrigation Method:</label>
                    <select id="method" name="method">
                        <option value="">-- Select Irrigation Method --</option>
                        <option value="Drip">Drip Irrigation</option>
                        <option value="Sprinkler">Sprinkler Irrigation</option>
                        <option value="Surface">Surface / Flood Irrigation</option>
                        <option value="Sub-irrigation">Sub-irrigation</option>
                    </select>
                    <span class="error-msg" id="methodError"></span>
                </div>

                <div class="form-group">
                    <label for="moisture">Soil Moisture (%):</label>
                    <input type="number" id="moisture" name="moisture" min="0" max="100" placeholder="Enter soil moisture percentage (0-100)">
                    <span class="error-msg" id="moistureError"></span>
                </div>

                <div class="form-group">
                    <label for="date">Registration Date:</label>
                    <input type="date" id="date" name="date">
                    <span class="error-msg" id="dateError"></span>
                </div>

                <div class="form-group">
                    <label for="photo">File Upload (Farm Photo):</label>
                    <input type="file" id="photo" name="photo" accept="image/*">
                    <span class="error-msg" id="photoError"></span>
                </div>

                <div style="margin-top: 15px;">
                    <input type="submit" value="Submit Registration">
                    <input type="reset" value="Reset Form">
                </div>

            </fieldset>
        </form>
    </div>
